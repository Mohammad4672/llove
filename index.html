<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Ruba ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #ff4fa3);
    color:white;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
}

.container{
    text-align:center;
    padding:25px;
    z-index:2;
    max-width:800px;
}

.name{
    font-size:65px;
    font-weight:800;
    color:#ffb6d9;
    text-shadow:0 0 25px #ff4fa3;
    margin-bottom:15px;
}

p{
    font-size:22px;
    line-height:1.9;
}

button{
    margin-top:30px;
    padding:14px 35px;
    border:none;
    border-radius:40px;
    background:#ff4fa3;
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 0 20px #ff4fa3;
}

#counter{
    margin-top:25px;
    font-size:22px;
    color:#ffd6ea;
    display:none;
}

.falling-text{
    position:absolute;
    top:-50px;
    font-size:24px;
    color:#ff4fa3;
    text-shadow:0 0 10px #ff4fa3;
    animation:fall linear forwards;
    pointer-events:none;
    white-space:nowrap;
}

@keyframes fall{
    0%{transform:translateY(0);opacity:0;}
    10%{opacity:1;}
    100%{transform:translateY(110vh);opacity:0;}
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

    <div class="name">Ruba ❤️</div>

    <p>
        يمكن الكلمات ما تكفي...<br>
        بس وجودك بحياتي لحالو قصة حلوة ما رح يكون في متلها وما رح يكون في غيرها 🌙<br>
        إنتِ الشي الوحيد يلي بيخلّي كل شي أحلى<br>
        بحبك قد القمر والنجوم وكل شي حلو بهالدنيا واكتر ❤️<br>
        اكبسي عالتاريخ يا قلبي
    </p>

    <button onclick="showCounter()">25/04/2025 - 3:21 PM</button>

    <div id="counter"></div>
</div>

<div id="falling-container"></div>

<script>
const startDate = new Date("2025-04-25T15:21:00");

function updateCounter(){
    const now = new Date();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const minutes = Math.floor((diff / (1000*60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("counter").innerHTML =
        `❤️ صرلي بعرف القمر من ${days} يوم ${hours} ساعة ${minutes} دقيقة ${seconds} ثانية`;
}

function showCounter(){
    document.getElementById("counter").style.display = "block";
    updateCounter();
    setInterval(updateCounter, 1000);
}

/* falling love */
function createFallingText(){
    const el = document.createElement("div");
    el.classList.add("falling-text");
    el.innerText = "بحبك ❤️";

    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = (3 + Math.random() * 4) + "s";

    document.getElementById("falling-container").appendChild(el);

    setTimeout(() => {
        el.remove();
    }, 7000);
}

setInterval(createFallingText, 300);
</script>

</body>
</html>
