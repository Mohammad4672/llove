<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Ruba ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
}

.container{
    text-align:center;
    padding:25px;
    z-index:2;
}

h1{
    font-size:55px;
    color:#ffb6d9;
    text-shadow:0 0 20px #ff4fa3;
}

p{
    font-size:22px;
    margin-top:10px;
}

button{
    margin-top:30px;
    padding:14px 35px;
    border:none;
    border-radius:40px;
    background:#ff4fa3;
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 0 20px #ff4fa3;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

#counter{
    margin-top:25px;
    font-size:22px;
    color:#ffd6ea;
    text-shadow:0 0 15px #ff4fa3;
    display:none;
}

.hearts span{
    position:absolute;
    bottom:-50px;
    color:#ff4fa3;
    font-size:25px;
    animation:float 8s linear infinite;
}

@keyframes float{
    0%{transform:translateY(0);opacity:0;}
    20%{opacity:1;}
    100%{transform:translateY(-120vh);opacity:0;}
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="hearts">
    <span style="left:10%;">❤️</span>
    <span style="left:30%;">❤️</span>
    <span style="left:50%;">❤️</span>
    <span style="left:70%;">❤️</span>
    <span style="left:90%;">❤️</span>
</div>

<div class="container">
    <h1>To Ruba ❤️</h1>

    <p> يمكن الكلمات ما تكفي...
        بس وجودك بحياتي لحالو قصة حلوة  ما رح يكون في متلا وما رح يكون في غيرها 🌙إنتِ الشي الوحيد يلي بيخلّي كل شي احلى
     بحبك قد القمر والنجوم وكل شي حلو بهالدنيا واكترر ❤️</p>

    <button onclick="showCounter()">اضغطي هون</button>

    <div id="counter"></div>
</div>

<script>
const startDate = new Date("2025-04-25T15:21:00");

function updateCounter(){
    const now = new Date();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const minutes = Math.floor((diff / (1000*60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("counter").innerHTML =
        `❤️ صرلي بعرف القمر من ${days} يوم ${hours} ساعة ${minutes} دقيقة ${seconds} ثانية`;
}

function showCounter(){
    document.getElementById("counter").style.display = "block";
    updateCounter();
    setInterval(updateCounter, 1000);
}
</script>

</body>
</html>
